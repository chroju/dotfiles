format = """\
$username\
$directory\
$git_branch\
${custom.git_change}\
$git_commit\
$git_state\
$git_status\
$golang\
$package\
$kubernetes\
$java\
$nodejs\
$python\
$ruby\
${custom.mise}\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
${custom.profile}\
$character"""

[aws]
displayed_items = "all"
disabled = true

[custom.git_change]
command = "echo '*'"
when = "git-change"
style = "bold purple"
shell = "zsh"
format = "[$symbol($output) ]($style)"

[git_status]
format = '([$conflicted$stashed$staged$ahead_behind]($style) )'
conflicted = "[${count}CONFLICTED](bold yellow)"
ahead = " ${count}⇡"
diverged = " ⇕${ahead_count}⇡${behind_count}⇣"
behind = " ${count}⇣"
stashed = '[${count}stashed](bold yellow)'
staged = '[$count++](green)'

[kubernetes]
disabled = false
symbol = "🐳 "
format = "[$symbol$context / $namespace]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[directory]
truncation_length = 0
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_symbol = ".../"

[terraform]
disabled = true

[custom.mise]
command = "mise ls --current 2>/dev/null | wc -l | tr -d ' '"
style = "bold cyan"
when = "test -n \"$(mise ls --current 2>/dev/null)\""
symbol = "mise»"
format = "[$symbol($output)]($style) "

[custom.profile]
command = "echo $AWS_PROFILE"
style = "bold yellow"
when = "test $AWS_PROFILE"
format = "[$output]($style) "
